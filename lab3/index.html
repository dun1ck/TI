<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RSA (вариант 1)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>RSA</h2>

    <h3>Шифрование</h3>

    <label>p:</label>
    <input type="number" id="p">

    <label>q:</label>
    <input type="number" id="q">

    <label>KC (закрытый ключ d):</label>
    <input type="number" id="d">

    <label>Файл:</label>
    <input type="file" id="fileEnc">

    <button onclick="encrypt()">Зашифровать</button>

    <h3>Дешифрование</h3>

    <label>r (модуль):</label>
    <input type="number" id="r">

    <label>KC (закрытый ключ d):</label>
    <input type="number" id="d2">

    <label>Файл:</label>
    <input type="file" id="fileDec">

    <button onclick="decrypt()">Расшифровать</button>

    <p id="output"></p>
</div>

<script src="script.js"></script>
</body>
</html>
